
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Reading List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>My Reading List</h1>
    <p>Keep track of the books you want to read and have finished.</p>

    <form id="book-form">
      <label for="book-title">Book Title</label>
      <input id="book-title" type="text" placeholder="Enter book title" required>

      <label for="book-author">Author</label>
      <input id="book-author" type="text" placeholder="Enter author name" required>

      <button type="submit">Add Book</button>
    </form>

    <h2>My Books</h2>
    <p id="empty-message">No books added yet.</p>
    <ul id="book-list"></ul>
    <p id="book-count">Total books: 0</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
